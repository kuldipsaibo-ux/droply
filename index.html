<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Droply - Price Alerts</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>Droply</h1>

  <p>Get notified when your product reaches your target price.</p>

  <input
    id="productUrl"
    type="url"
    placeholder="Paste Amazon product URL"
  >

  <input
    id="targetPrice"
    type="number"
    placeholder="Target price (₹)"
  >

  <input
    id="email"
    type="email"
    placeholder="Your email address"
  >

  <button id="setAlert">
    Set Price Alert
  </button>

  <div id="message"></div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAuQvRtusTqOmb_tA0xQm12VJPQQYnvzfA",
      authDomain: "droply-fa6f6.firebaseapp.com",
      projectId: "droply-fa6f6",
      storageBucket: "droply-fa6f6.firebasestorage.app",
      messagingSenderId: "993632750410",
      appId: "1:993632750410:web:373d3d6399ad705d874fb3",
      measurementId: "G-MQ7JRR824Q"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    document
      .getElementById("setAlert")
      .addEventListener("click", async () => {

        const productUrl =
          document.getElementById("productUrl").value.trim();

        const targetPrice =
          document.getElementById("targetPrice").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const message =
          document.getElementById("message");


        if (!productUrl || !targetPrice || !email) {
          message.textContent =
            "Please enter the product URL, target price and email.";

          return;
        }


        try {

          await addDoc(
            collection(db, "priceAlerts"),
            {
              productUrl: productUrl,
              targetPrice: Number(targetPrice),
              email: email,
              createdAt: serverTimestamp(),
              status: "watching"
            }
          );


          message.textContent =
            "✅ Price alert created!";


          document.getElementById("productUrl").value = "";
          document.getElementById("targetPrice").value = "";
          document.getElementById("email").value = "";

        } catch (error) {

          console.error(error);

          message.textContent =
            "❌ Could not create alert.";

        }

      });

  </script>

</body>
</html>
